<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sync Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Sync Studio</h1>
  <p class="sub">Upload a workbook, consolidate every tab by matching header text, edit the result, then push changes back into the original tabs (changed cells highlighted yellow).</p>

  <div class="card" id="upload-card">
    <input type="file" id="file-input" accept=".xlsx">
    <button id="upload-btn">Upload &amp; Consolidate</button>
    <div id="upload-error" class="error" hidden></div>
  </div>

  <div id="detections-card" class="card" hidden>
    <strong>Header row detection</strong>
    <div id="detections-list"></div>
  </div>

  <div id="grid-card" class="card" hidden>
    <div class="toolbar">
      <button id="add-column-btn">+ Add Column</button>
      <button id="download-btn">Download Master</button>
      <button id="push-btn" class="primary">Push Changes back to Tabs</button>
      <span id="status-msg"></span>
    </div>
    <div id="table-wrap"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
